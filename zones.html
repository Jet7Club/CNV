<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CNV — Interactive map of the 8 zones</title><style>html{scroll-behavior:smooth}body{margin:0;background:#f7f8f3;font-family:Arial,sans-serif;color:#153c30}.nav{display:flex;justify-content:space-between;align-items:center;padding:20px max(20px,5vw);background:#092f26;color:#fff}.nav{flex-wrap:wrap;gap:12px}.nav a{color:#e8cc86;text-decoration:none;font-weight:bold}.nav strong{letter-spacing:.1em}#village{max-width:1300px;margin:35px auto;padding:0 15px}.footer{text-align:center;padding:25px;font-size:13px}</style></head><body><div class="nav"><strong>CHILL NATURAL VILLAGES</strong><a id="mapBack" href="./#village">← Back to the village</a><select id="mapLang" aria-label="Language"><option value="en">EN</option><option value="fr">FR</option><option value="es">ES</option></select></div><main id="village"></main><footer class="footer" id="mapFooter">CNV · Conceptual map of the 8 zones · 5 villages</footer><script>
const copy={
  en:["Interactive map of the 8 zones","Back to the village","Conceptual map of the 8 zones","Language"],
  fr:["Carte interactive des 8 zones","Retour au village","Carte conceptuelle des 8 zones · 5 villages","Langue"],
  es:["Mapa interactivo de las 8 zonas","Volver al pueblo","Mapa conceptual de las 8 zonas · 5 pueblos","Idioma"]
};
const select=document.getElementById("mapLang");
function setLanguage(requested){
  const lang=Object.hasOwn(copy,requested)?requested:"en";
  const [title,back,footer,label]=copy[lang];
  document.documentElement.lang=select.value=lang;
  document.title="CNV — "+title;
  document.getElementById("mapBack").textContent="← "+back;
  document.getElementById("mapFooter").textContent="CNV · "+footer;
  select.setAttribute("aria-label",label);
}
select.addEventListener("change",()=>setLanguage(select.value));
setLanguage(new URLSearchParams(location.search).get("lang"));
</script><script src="assets/cnv-zone-map.js?v=20261121-8"></script></body></html>
