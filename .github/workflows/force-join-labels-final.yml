name: Force final CNV join labels

on:
  push:
    paths:
      - 'members.html'
      - '.github/workflows/force-join-labels-final.yml'
      - '.github/scripts/force_join_labels_final.py'
      - '.github/scripts/force_fr_es_adventure_labels_runtime.py'
      - '.github/scripts/translate_empower_labels.py'
      - '.github/scripts/remove_gallery_all_runtime.py'
      - '.github/scripts/optimize_image_loading.py'
      - '.github/scripts/cleanup_runtime_patches.py'
      - '.github/scripts/integrate_members_nav_native.py'
      - '.github/scripts/sync_members_language_runtime.py'
      - '.github/scripts/full_translation_audit_runtime.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact FR EN ES labels
        run: python .github/scripts/force_join_labels_final.py
      - name: Enforce visible labels after language switching
        run: python .github/scripts/force_fr_es_adventure_labels_runtime.py
      - name: Translate Empower in FR and ES
        run: python .github/scripts/translate_empower_labels.py
      - name: Remove All/Tout gallery button
        run: python .github/scripts/remove_gallery_all_runtime.py
      - name: Optimize image loading
        run: python .github/scripts/optimize_image_loading.py
      - name: Clean obsolete runtime patches
        run: python .github/scripts/cleanup_runtime_patches.py
      - name: Integrate Members natively in navigation
        run: python .github/scripts/integrate_members_nav_native.py
      - name: Sync Members language with main site
        run: python .github/scripts/sync_members_language_runtime.py
      - name: Full translation audit pass 1
        run: python .github/scripts/full_translation_audit_runtime.py
      - name: Full translation audit pass 2
        run: python .github/scripts/full_translation_audit_runtime.py
      - name: Commit optimized index.html
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Audit and fix EN ES FR translations twice"
          git push
