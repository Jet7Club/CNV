name: Fix members ambassador labels

on:
  push:
    paths:
      - '.github/workflows/fix-members-ambassador.yml'
      - '.github/scripts/fix_members_ambassador.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update members labels
        run: python .github/scripts/fix_members_ambassador.py
      - name: Commit changes
        run: |
          if git diff --quiet -- members.html; then
            echo "No members changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add members.html
          git commit -m "Update members Patron labels to Ambassador translations"
          git push
