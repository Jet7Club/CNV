name: Diagnose CNV zone map
on:
  push:
    paths: ['.github/workflows/diagnose-cnv-zone-map.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect source and public site
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request,re
          src=Path('index.html').read_text(encoding='utf-8')
          def inspect(label,s):
              print('INSPECT',label,'length',len(s))
              for term in ['assets/cnv-zone-map.js','id="village"',"id='village'",'id="cnv-zone-map-v2"','id="village-section"','id="villageMap"','<main','</body>']:
                  print(repr(term),'COUNT',s.count(term),'POSITION',s.find(term))
              for m in list(re.finditer(r'id=["\\\'][^"\\\']*village[^"\\\']*["\\\']',s,re.I))[:12]:
                  print('VILLAGE ID',repr(s[m.start()-100:m.end()+100]))
              for m in list(re.finditer(r'cnv-zone-map.js',s))[:4]:
                  print('SCRIPT CONTEXT',repr(s[m.start()-100:m.end()+100]))
          for term in ['A complete ecosystem designed at human scale.','Cada zona tiene una función clara','Un écosystème complet, pensé à l','Chaque zone a une fonction claire']:
              for m in list(re.finditer(re.escape(term),src,re.I))[:3]:
                  print('LANGUAGE CONTEXT',repr(term),repr(src[max(0,m.start()-220):m.start()+650]))
          for term in ['data-i18n','translations','setLanguage','i18n','const dict']:
              print('TRANSLATION MECHANISM',term,src.count(term))
          inspect('SOURCE',src)
          start=src.find('<section class="section" id="village">')
          print('VILLAGE MAP STRUCTURE',[(m.start(),src[start+m.start():start+m.start()+170]) for m in re.finditer(r'<div class="(?:master|map|panel)"|id="cnv-map-embed"|cnv-map-direct-link',src[start:start+300000])][:15])
          req=urllib.request.Request('https://www.cnvillages.com/?map_diag=20261025',headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=40) as r:
              print('LIVE STATUS',r.status)
              live=r.read().decode('utf-8','replace')
              inspect('LIVE',live)
              v=live.find('<section class="section" id="village">')
              print('LIVE MAP STRUCTURE',[(m.start(),live[v+m.start():v+m.start()+170]) for m in re.finditer(r'<div class="(?:master|map|panel)"|id="cnv-map-embed"|cnv-map-direct-link',live[v:v+300000])][:15])
          req=urllib.request.Request('https://www.cnvillages.com/assets/cnv-zone-map.js?map_diag=20261025',headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=40) as r:
              body=r.read().decode('utf-8','replace')
              print('JS STATUS',r.status,'LENGTH',len(body),'VALID MARKER', 'cnv-zone-map-v2' in body)
          PY
