name: Fix CNV site language consistency
on:
  push:
    paths: ['.github/workflows/fix-cnv-site-language.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct translations and install Village language guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          tag='<script defer src="assets/cnv-village-language-guard.js"></script>'
          if tag not in s:s=s.replace('</body>',tag+'\n</body>',1)
          # The 7 micro-villages exclude staff, but include Senior.
          s=s.replace('Camp libre, Équipe et Seniors','Camp libre et Seniors')
          s=s.replace('Campamento libre, Equipo y Mayores','Campamento libre y Mayores')
          s=s.replace('Campamento libre, Equipo y Senior','Campamento libre y Senior')
          s=s.replace('Free Camp, Staff and Senior','Free Camp and Senior')
          s=s.replace('Free Camp, Staff, and Senior','Free Camp and Senior')
          p.write_text(s,encoding='utf-8')
          assert s.count(tag)==1
          print('Village translation guard installed; source has',len(s),'characters')
          PY
      - name: Check JavaScript
        run: node --check assets/cnv-village-language-guard.js
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix multilingual Village content and preserve seven micro-villages"
          git pull --rebase origin main
          git push
