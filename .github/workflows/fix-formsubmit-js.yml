name: Fix CNV FormSubmit JS redirect

on:
  push:
    branches: [fix-formsubmit-js]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-formsubmit-js
          fetch-depth: 0
      - name: Patch form
        run: python3 .github/scripts/fix_formsubmit_ajax.py
      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "CNV: submit contact form by AJAX and redirect home"
          git push origin HEAD:fix-formsubmit-js
