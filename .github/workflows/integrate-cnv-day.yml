name: Integrate CNV personalized day
on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/cnv-personalized-day.js'
      - 'assets/cnv-personalized-day.css'
      - '.github/scripts/integrate_cnv_day.py'
      - '.github/workflows/integrate-cnv-day.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Add personalized day to CNV
        run: python .github/scripts/integrate_cnv_day.py
      - name: Extract original profile selectors for personalization audit
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json
          class Selects(HTMLParser):
              def __init__(self): super().__init__(); self.groups=[]; self.current=None; self.option=None
              def handle_starttag(self,tag,attrs):
                  if tag=='select': self.current={'attrs':dict(attrs),'options':[]}
                  elif tag=='option' and self.current is not None: self.option=[]
              def handle_data(self,data):
                  if self.option is not None: self.option.append(data)
              def handle_endtag(self,tag):
                  if tag=='option' and self.option is not None and self.current is not None:
                      v=' '.join(''.join(self.option).split()); self.option=None
                      if v and v not in self.current['options']: self.current['options'].append(v)
                  elif tag=='select' and self.current is not None:
                      if len(self.current['options'])>=10: self.groups.append(self.current)
                      self.current=None
          parser=Selects(); parser.feed(Path('index.html').read_text(encoding='utf-8'))
          Path('assets/cnv-profile-selectors.json').write_text(json.dumps(parser.groups,ensure_ascii=False,indent=2),encoding='utf-8')
          print('Extracted',len(parser.groups),'profile-like selectors')
          import re
          source=Path('index.html').read_text(encoding='utf-8')
          candidates=[]
          for needle in ['function chooseCategory','chooseCategory(', 'const profileData', 'const profiles', 'profileOptions', 'profileMap', 'categoryProfiles', 'profile-select-col']:
              pos=0
              for _ in range(3):
                  i=source.find(needle,pos)
                  if i<0: break
                  candidates.append('MATCH '+needle+' AT '+str(i)+'\\n'+source[max(0,i-300):i+16000])
                  pos=i+len(needle)
          Path('assets/cnv-profile-source-extract.txt').write_text('\\n--- PROFILE SOURCE ---\\n'.join(candidates),encoding='utf-8')
          print('Extracted source regions',len(candidates))
          class Cards(HTMLParser):
              def __init__(self): super().__init__(); self.depth=0; self.card=None; self.field=None; self.cards=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if self.card is not None: self.depth+=1
                  elif tag in ('article','div') and 'path-card' in d.get('class','').split():
                      self.card={'category':d.get('data-cat',''),'name':'','number':'','text':''};self.depth=1
                  if self.card is not None and tag=='h3':self.field='name'
                  if self.card is not None and 'path-num' in d.get('class','').split():self.field='number'
              def handle_data(self,data):
                  if self.card is not None:
                      self.card['text']+=data+' '
                      if self.field:self.card[self.field]+=data
              def handle_endtag(self,tag):
                  if self.card is not None:
                      if tag in ('h3','span'):self.field=None
                      self.depth-=1
                      if self.depth<=0:
                          self.card['text']=' '.join(self.card['text'].split())[:1200]
                          self.cards.append(self.card);self.card=None;self.field=None
          cards=Cards();cards.feed(source)
          Path('assets/cnv-actual-profiles.json').write_text(json.dumps(cards.cards,ensure_ascii=False,indent=2),encoding='utf-8')
          print('Extracted profile cards',len(cards.cards))

          PY
      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/cnv-profile-selectors.json assets/cnv-profile-source-extract.txt assets/cnv-actual-profiles.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish personalized CNV day on website"
            git push
          fi
