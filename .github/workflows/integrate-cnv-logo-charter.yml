name: Integrate CNV logo and charter
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Integrate when all four supplied assets are present
        run: python .github/scripts/integrate_cnv_logo_charter.py
      - name: Commit website update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Integrate CNV logo and multilingual charter button"
            git push
          fi
