name: Remove Staff Village from CNV source
on:
  push:
    paths:
      - '.github/workflows/remove-staff-village.yml'
      - '.github/scripts/remove_staff_village.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Staff Village from source HTML
        run: python .github/scripts/remove_staff_village.py
      - name: Commit updated website
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove Staff Village and update seven micro-villages in site source"
          git push
