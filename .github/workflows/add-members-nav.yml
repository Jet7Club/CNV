name: Add Members nav
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-members-nav.yml'
permissions:
  contents: write
jobs:
  update-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Members link
        run: python .github/scripts/add_members_nav.py
      - name: Commit navigation update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Add Members to main navigation"
            git push
          fi
