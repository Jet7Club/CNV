name: Fix visible CNV adventure order

on:
  push:
    paths:
      - '.github/workflows/fix-visible-adventure-order.yml'
      - '.github/scripts/fix_visible_adventure_order.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix visible adventure order
        run: python .github/scripts/fix_visible_adventure_order.py
      - name: Commit index correction
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix visible CNV adventure order in FR EN ES"
          git push
