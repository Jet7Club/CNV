name: Embed interactive CNV map in index
on:
  push:
    paths: ['.github/workflows/embed-cnv-map-index.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add embedded map to Village
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<section class="section" id="village">'
          if marker not in s: raise RuntimeError('Village section missing')
          embed='<div id="cnv-map-embed" style="width:100%;margin:22px auto;max-width:1350px"></div>'
          if 'id="cnv-map-embed"' not in s:
              s=s.replace(marker,marker+'\n'+embed,1)
              p.write_text(s,encoding='utf-8')
              print('EMBEDDED CNV MAP CONTAINER IN INDEX',s.count('id="cnv-map-embed"'))
          else: print('CNV map already embedded')
          PY
      - name: Commit to main
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Embed full 26-zone interactive map inside Village on homepage"
          git push
