name: CNV membership inspect and safe correction
on:
  push:
    branches: [fix/membership-translations-2026-11-21]
    paths: [.github/workflows/cnv-membership-patch.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore English and inspect translations
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          bad='life:["VILLAGE EDITION","5.000 tarjetas vitalicias por pueblo","By invitation only","red"]'
          good='life:["VILLAGE EDITION","5,000 lifetime cards per village","By invitation only","red"]'
          assert s.count(bad)==1, "Unexpected source, no change"
          s=s.replace(bad,good,1)
          p.write_text(s,encoding="utf-8")
          for term in ["membershipMainTitle","EDICIÓN","ÉDITION","VILLAGE EDITION","Members, owners and investor","membership"]:
              print("SEARCH",repr(term),"COUNT",s.lower().count(term.lower()))
              pos=0
              for i in range(min(s.lower().count(term.lower()),8)):
                  pos=s.lower().find(term.lower(),pos)
                  print("CONTEXT",repr(s[max(0,pos-240):pos+350]))
                  pos+=len(term)
      - name: Commit restoration to working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore English fallback pending language-specific translation fixes"
          git push
