name: CNV membership translation patch
on:
  push:
    branches: [fix/membership-translations-2026-11-21]
    paths: [.github/workflows/cnv-membership-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Safely patch only exact matching text
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          replacements = [
              ("Members, Owners & Investors: Privileges", "Membres, propriétaires et investisseurs : privilèges"),
              ("Miembros, Propietarios e Inversores: Privilegios", "Miembros, propietarios e inversores: privilegios"),
              ("5,000 lifetime cards per village", "5.000 tarjetas vitalicias por pueblo"),
          ]
          print("File length:",len(s))
          for old,new in replacements:
              n=s.count(old)
              print(repr(old), "matches", n)
              if n == 1:
                  s=s.replace(old,new,1)
          if s == p.read_text(encoding="utf-8"):
              print("No exact matches. No modifications made.")
          else:
              p.write_text(s,encoding="utf-8")
      - name: Commit changes to working branch only
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply exact CNV membership translation corrections"
          git push
