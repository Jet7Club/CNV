name: CNV membership exact localization fixes
on:
  push:
    branches: [fix/membership-translations-2026-11-21]
    paths: [.github/workflows/cnv-membership-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply three exact localized corrections
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          pairs=[
            ('<h3 id="membershipMainTitle">Members, owners and investor &amp; privileges</h3>','<h3 id="membershipMainTitle">Members, owners and investors &amp; privileges</h3>'),
            ('"5.000 tarjetas vitalicias por village"','"5.000 tarjetas vitalicias por pueblo"'),
            ('"Miembros, propietarios e inversores & privilegios"','"Miembros, propietarios e inversores y privilegios"'),
            ('"Membres, propriétaires et investisseurs & privilèges"','"Membres, propriétaires et investisseurs et privilèges"')
          ]
          for old,new in pairs:
            count=s.count(old)
            print("MATCH",repr(old),count)
            assert count==1, "Unexpected occurrence count"
            s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Correct CNV membership FR ES and English text"
          git push
